name: Hydrate PCBOD source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/hydrate-source.yml"

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/pcbod-site.b64
          base64 --decode /tmp/pcbod-site.b64 > /tmp/pcbod-site.tgz
          tar -xzf /tmp/pcbod-site.tgz -C /tmp
          rsync -a /tmp/pcbod-site/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/hydrate-source.yml

      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hydrate PCBOD website source"
          git push
